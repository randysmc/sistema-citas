<mat-card class="mat-elevation-z8">
  <mat-card-header>
    <mat-card-title class="text-center">
      {{ horarioLaboralId ? 'Editar Horario Laboral' : 'Agregar Nuevo Horario Laboral' }}
    </mat-card-title>
    <mat-card-subtitle class="text-center">
      Complete el formulario para {{ horarioLaboralId ? 'editar' : 'crear' }} el horario laboral
    </mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <form (ngSubmit)="onSubmit()" novalidate>
      <!-- Día de la Semana -->
      <mat-form-field class="w100 mb-3" appearance="fill">
        <mat-label>Día de la Semana</mat-label>
        <mat-select 
          [(ngModel)]="horarioLaboral.dia" 
          name="dia" 
          [disabled]="!!horarioLaboralId"
          required>
          <mat-option value="LUNES">Lunes</mat-option>
          <mat-option value="MARTES">Martes</mat-option>
          <mat-option value="MIERCOLES">Miércoles</mat-option>
          <mat-option value="JUEVES">Jueves</mat-option>
          <mat-option value="VIERNES">Viernes</mat-option>
          <mat-option value="SABADO">Sábado</mat-option>
          <mat-option value="DOMINGO">Domingo</mat-option>
        </mat-select>
      </mat-form-field>
      
      <mat-form-field class="w100 mb-3" appearance="fill">
        <mat-label>Hora de Inicio</mat-label>
        <input matInput type="time" [(ngModel)]="horarioLaboral.horaInicio" name="horaInicio" required />
      </mat-form-field>
      
      <mat-form-field class="w100 mb-3" appearance="fill">
        <mat-label>Hora de Fin</mat-label>
        <input matInput type="time" [(ngModel)]="horarioLaboral.horaFin" name="horaFin" required />
      </mat-form-field>
      

      <!-- Botón de guardar o actualizar -->
      <div class="text-center mt-4">
        <button mat-raised-button color="primary" class="px-5">
          <mat-icon>save</mat-icon>
          {{ horarioLaboralId ? 'Actualizar' : 'Guardar' }} Horario
        </button>
        

      </div>
      
    </form>
    <button mat-raised-button color="warn" (click)="regresar()">Regresar</button>
  </mat-card-content>
</mat-card>
