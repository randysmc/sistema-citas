<mat-card class="mat-elevation-z8">
    <mat-card-header>
      <mat-card-title class="text-center">
        {{ recursoId ? 'Editar Recurso' : 'Agregar Nuevo Recurso' }}
      </mat-card-title>
      <mat-card-subtitle class="text-center">
        Complete el formulario para {{ recursoId ? 'editar' : 'crear' }} el recurso
      </mat-card-subtitle>
    </mat-card-header>
  
    <mat-card-content>
      <form (ngSubmit)="formSubmit()">
        <mat-form-field class="w100 mb-3" appearance="fill">
          <mat-label>Nombre del Recurso</mat-label>
          <input
            required
            matInput
            placeholder="Digite el nombre del recurso"
            [(ngModel)]="recurso.nombre"
            name="nombre"
          />
        </mat-form-field>
  
        <mat-form-field class="w100 mb-3" appearance="fill">
          <mat-label>Descripción</mat-label>
          <textarea
            required
            matInput
            placeholder="Digite la descripción del recurso"
            rows="6"
            [(ngModel)]="recurso.descripcion"
            name="descripcion"
          ></textarea>
        </mat-form-field>
  
        <mat-form-field class="w100 mb-3" appearance="fill">
          <mat-label>Tipo de Recurso</mat-label>
          <mat-select [(ngModel)]="recurso.tipo" name="tipo">
            <mat-option *ngFor="let tipo of tipos" [value]="tipo">{{ tipo }}</mat-option>
          </mat-select>
        </mat-form-field>
  
        <mat-checkbox [(ngModel)]="recurso.disponible" name="disponible">
          ¿Está disponible?
        </mat-checkbox>
  
        <div class="text-center mt-4">
          <button mat-raised-button color="primary" class="px-5">
            <mat-icon>save</mat-icon>
            {{ recursoId ? 'Actualizar' : 'Guardar' }} Recurso
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
